# Perfil dev — carga datos demo para Swagger/Bruno sin auth
# Usa: ./gradlew :negocio:bootRun --args='--spring.profiles.active=dev,secrets'
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-dev.sql
spring.jpa.defer-datasource-initialization=true
spring.sql.init.continue-on-error=true
# No usar en prod — prod usa ddl-auto=update sin data.sql
