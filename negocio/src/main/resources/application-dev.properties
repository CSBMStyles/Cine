# Perfil dev — carga datos demo para Swagger/Bruno sin auth
# Usa: ./gradlew :negocio:bootRun --args='--spring.profiles.active=dev,secrets'
# Reinicia la BD en cada arranque: borra y recrea el esquema, luego data-dev.sql
# lo repuebla (INSERT IGNORE). Para conservar datos entre arranques, cambiar a update.
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-dev.sql
spring.jpa.defer-datasource-initialization=true
spring.sql.init.continue-on-error=true
# No usar en prod — prod usa ddl-auto=update sin data.sql
